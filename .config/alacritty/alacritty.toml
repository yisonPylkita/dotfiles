[general]
import = ["themes/themes/aura.toml"]

# Run maximized, not fullscreen: this keeps the macOS menu/status bar visible
# and keeps terminal content clear of the MacBook Pro notch.
[window]
decorations = "none"
startup_mode = "Maximized"
option_as_alt = "Both"

[font]
size = 13.0

[font.normal]
family = "CaskaydiaCove Nerd Font Mono"
style = "Regular"

[font.bold]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold"

[font.italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font Mono"
style = "Bold Italic"

[scrolling]
history = 100000

[mouse]
hide_when_typing = true

[cursor]
style = { shape = "Block", blinking = "On" }

[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "zellij attach -c main || zellij"]

[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "T"
mods = "Command"
action = "ReceiveChar"
